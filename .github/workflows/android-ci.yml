name: Android CI

on:
  push:
    branches: [main, development-aura]
  pull_request:
    branches: [main, development-aura]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Security Scan, Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan repository for leaked secrets and sensitive files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)(local\.properties|\.env(\..*)?|google-services\.json)$|\.(jks|keystore|p12|pem|key)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Sensitive or keystore files must not be tracked in Git:"
            echo "$forbidden"
            exit 1
          fi
          leaks=$(git grep -n -E 'AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' -- ':!.github/workflows/android-ci.yml' || true)
          if [ -n "$leaks" ]; then
            echo "::error::Potential secret or API key detected in tracked files:"
            echo "$leaks"
            exit 1
          fi
          echo "Secret and sensitive file check passed."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, run unit tests, and lint
        env:
          GEMINI_API_KEY: ""
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug*
